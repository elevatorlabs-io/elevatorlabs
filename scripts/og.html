<!DOCTYPE html>
<!-- Plantilla de la imagen para redes (1200×630) y de los iconos PNG. Ver README: «Imágenes para redes». -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Sora:wght@700&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#050607;color:#f1f5f5;font-family:Inter,sans-serif;overflow:hidden}
  .og{position:relative;width:1200px;height:630px;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .og::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:60px 60px}
  .og::after{content:"";position:absolute;width:900px;height:900px;right:-300px;top:-380px;background:radial-gradient(circle,rgba(45,212,191,.28),transparent 62%)}
  .og>*{position:relative;z-index:1}
  .og img{height:64px;align-self:flex-start}
  h1{font-family:Sora,sans-serif;font-size:68px;line-height:1.08;letter-spacing:-.02em;max-width:900px}
  h1 span{color:#2dd4bf}
  p{font-size:26px;color:#a3aeb5;margin-top:22px}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:22px;color:#a3aeb5}
  .foot b{color:#2dd4bf;font-weight:600}
  .icon{display:none;width:100vw;height:100vh;place-items:center;background:#050607}
  .icon img{width:72%}
  body.is-icon .og{display:none} body.is-icon .icon{display:grid}
</style></head>
<body>
  <div class="og">
    <img src="../assets/images/logos/logo-labs-blanco.svg" alt="">
    <div><h1>Eficiencia operativa<br>impulsada por <span>tecnología</span></h1><p>Mejora de procesos · Automatización · Software a medida · IA</p></div>
    <div class="foot"><span>Medellín, Colombia · Latinoamérica</span><b>elevatorlabs.io</b></div>
  </div>
  <div class="icon"><img src="../assets/images/logos/icono.svg" alt=""></div>
  <script>if(location.hash==="#icon")document.body.classList.add("is-icon")</script>
</body></html>
